services:
  # 1. MySQL Database
  db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_DATABASE: email_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # 2. RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-broker
    ports:
      - "5672:5672"
      - "15672:15672"

  # 3. Spring Boot Backend
  backend:
    build: ./backend-java
    container_name: spring-backend
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    environment:
      - DB_HOST=db
      - RABBIT_HOST=rabbitmq
    # These override any settings in your properties file when in Docker
    restart: on-failure

  # 4. React Frontend
  frontend:
    build: ./frontend-react
    container_name: react-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always