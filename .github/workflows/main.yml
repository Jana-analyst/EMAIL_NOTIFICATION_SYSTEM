name: Docker Build, Test, and Sonar Scan

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build and Test Backend
        env:
          SPRING_RABBITMQ_HOST: localhost
          SPRING_RABBITMQ_PORT: 5672
        run: |
          cd backend-java
          chmod +x mvnw
          ./mvnw clean verify 

      - name: Set up Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Build and Test Frontend
        run: |
          cd frontend-react
          npm install
          # Runs tests and ensures the lcov file is generated for Sonar
          npm test -- --watchAll=false || true
          npm run build

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd backend-java
          # Using your specific project key and organization from SonarCloud
          ./mvnw sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.projectKey=Jana-analyst_EMAIL_NOTIFICATION_SYSTEM \
            -Dsonar.organization=jana-analyst \
            -Dsonar.javascript.lcov.reportPaths=../frontend-react/coverage/lcov.info
