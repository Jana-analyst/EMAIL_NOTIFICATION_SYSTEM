name: Docker Build and Test

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # This section starts RabbitMQ so your integration tests can pass!
    services:
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build and Test Backend
        env:
          # Tells Spring Boot to look for RabbitMQ on the local runner
          SPRING_RABBITMQ_HOST: localhost
          SPRING_RABBITMQ_PORT: 5672
        run: |
          cd backend-java
          chmod +x mvnw
          ./mvnw clean verify

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Build and Test Frontend
        run: |
          cd frontend-react
          npm install
          npm test -- --watchAll=false
          npm run build

      - name: Verify Docker Compose
        run: docker compose build
