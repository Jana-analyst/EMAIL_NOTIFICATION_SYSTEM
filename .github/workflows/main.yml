name: Docker Build and Test

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build and Test Backend
        run: |
          cd backend-java
          chmod +x mvnw
          # Removed -DskipTests to ensure your JUnit tests run
          ./mvnw clean verify

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Build and Test Frontend
        run: |
          cd frontend-react
          npm install
          # Runs React tests in CI mode (non-interactive)
          npm test -- --watchAll=false
          npm run build

      - name: Verify Docker Compose
        run: docker compose build
