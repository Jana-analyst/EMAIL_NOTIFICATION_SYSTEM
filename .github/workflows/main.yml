name: Docker Build, Test, and Sonar Scan

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3-management
        ports: [5672:5672]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important: SonarQube needs full history for better analysis

      - name: Build and Test Backend
        run: |
          cd backend-java
          ./mvnw clean verify # JaCoCo will automatically create the report now
          
      - name: Build and Test Frontend
        run: |
          cd frontend-react
          npm install
          npm test # Generates the coverage/lcov.info file
          
      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          # Use the Maven Sonar plugin for Java and point it to the React coverage file
          cd backend-java
          ./mvnw sonar:sonar \
            -Dsonar.projectKey=YOUR_PROJECT_KEY \
            -Dsonar.javascript.lcov.reportPaths=../frontend-react/coverage/lcov.info
